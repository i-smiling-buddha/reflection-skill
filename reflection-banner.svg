<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#334155" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280"/>
    <path d="M160 0 V400 M320 0 V400 M480 0 V400 M640 0 V400 M800 0 V400 M960 0 V400 M1120 0 V400" opacity="0.6"/>
  </g>
  <!-- original app window and its reflection -->
  <g transform="translate(110 70)">
    <rect width="250" height="150" rx="14" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/><circle cx="40" cy="20" r="5" fill="#fbbf24"/><circle cx="58" cy="20" r="5" fill="#34d399"/>
    <rect x="20" y="42" width="70" height="88" rx="6" fill="#334155"/>
    <rect x="104" y="42" width="126" height="14" rx="4" fill="#f59e0b"/>
    <rect x="104" y="66" width="100" height="10" rx="4" fill="#475569"/>
    <rect x="104" y="84" width="112" height="10" rx="4" fill="#475569"/>
    <rect x="104" y="110" width="60" height="20" rx="6" fill="#6366f1"/>
  </g>
  <line x1="90" y1="238" x2="380" y2="238" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <g transform="translate(110 256) scale(1 -1) translate(0 -150)" opacity="0.55">
    <rect width="250" height="150" rx="14" fill="none" stroke="url(#fade)" stroke-width="3"/>
    <rect x="20" y="42" width="70" height="88" rx="6" fill="url(#fade)"/>
    <rect x="104" y="42" width="126" height="14" rx="4" fill="url(#fade)"/>
    <rect x="104" y="110" width="60" height="20" rx="6" fill="url(#fade)"/>
  </g>
  <text x="440" y="150" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="74" font-weight="700" fill="#f8fafc">Reflection</text>
  <text x="840" y="150" font-family="Nirmala UI, Noto Sans Devanagari, Mangal, sans-serif" font-size="58" font-weight="700" fill="url(#glow)">प्रतिबिंब</text>
  <text x="442" y="205" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" fill="#cbd5e1">Recreate any app, website, game or software — clean-room.</text>
  <text x="442" y="245" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#94a3b8">Study → Build → Check → Refine · evidence-labelled · your own brand</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="442" y="285" width="170" height="40" rx="20" fill="#312e81"/><text x="527" y="311" text-anchor="middle" fill="#c7d2fe">Free Agent Skill</text>
    <rect x="626" y="285" width="100" height="40" rx="20" fill="#312e81"/><text x="676" y="311" text-anchor="middle" fill="#c7d2fe">MIT</text>
    <rect x="740" y="285" width="200" height="40" rx="20" fill="#312e81"/><text x="840" y="311" text-anchor="middle" fill="#c7d2fe">40+ AI agents</text>
  </g>
  <text x="1240" y="380" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#64748b">by Smiling Buddha · DESITechnology</text>
</svg>
